name: "Guardian Terraform Plan"

on:
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - "docker/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  plan:
    name: "Terraform Plan"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via WIF
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.2"

      - name: Setup Guardian
        uses: abcxyz/actions/.github/actions/setup-binary@main
        with:
          download_url: "https://github.com/abcxyz/guardian/releases/download/v3.2.5/guardian_3.2.5_linux_amd64.tar.gz"
          install_path: "${{ runner.temp }}/guardian"
          binary_subpath: "guardian"
          add_to_path: "true"
          cache_key: "guardian-v3.2.5"

      - name: Guardian Terraform Plan
        run: |
          guardian plan \
            -dir=terraform \
            -storage=gcs://${{ vars.GCP_TF_STATE_BUCKET }} \
            -allow-lockfile-changes
        env:
          GUARDIAN_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ vars.GCP_REGION }}
          TF_VAR_zone: ${{ vars.GCP_ZONE }}
          TF_VAR_service_account_email: ${{ vars.GCP_SERVICE_ACCOUNT }}
