name: "Guardian Terraform Deploy & Container Sync"

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - "docker/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: "Terraform Apply & Container Push"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via WIF
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.2"

      - name: Setup Guardian
        uses: abcxyz/actions/.github/actions/setup-binary@main
        with:
          download_url: "https://github.com/abcxyz/guardian/releases/download/v3.2.5/guardian_3.2.5_linux_amd64.tar.gz"
          install_path: "${{ runner.temp }}/guardian"
          binary_subpath: "guardian"
          add_to_path: "true"
          cache_key: "guardian-v3.2.5"

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Terraform Init & Apply
        run: |
          cd terraform
          terraform init
          terraform apply -auto-approve
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ vars.GCP_REGION }}
          TF_VAR_zone: ${{ vars.GCP_ZONE }}
          TF_VAR_service_account_email: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Seed Secret Payloads
        run: |
          chmod +x scripts/seed_secrets.sh
          ./scripts/seed_secrets.sh
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALLOWED_USER_IDS: ${{ secrets.ALLOWED_USER_IDS }}

      - name: Pre-Flight Secret Verification Gate
        run: |
          chmod +x scripts/verify_secret_versions.sh
          ./scripts/verify_secret_versions.sh
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        run: |
          IMAGE_URI="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/openclaw/app:latest"
          docker build -t "$IMAGE_URI" -f docker/Dockerfile .
          docker push "$IMAGE_URI"

      # Re-runs the startup script defined in
      # terraform/modules/compute/templates/startup-script.sh.tftpl, which does the
      # docker pull + stop/rm + run. Keeping the redeploy logic there (rather than
      # duplicating `docker run` here) means Terraform stays the single source of
      # truth for how the container is launched.
      #
      # Instance name must match `instance_name` in
      # terraform/modules/compute/variables.tf.
      - name: Redeploy Container on GCE Instance
        run: |
          gcloud compute ssh openclaw-vm \
            --zone=${{ vars.GCP_ZONE }} \
            --project=${{ vars.GCP_PROJECT_ID }} \
            --tunnel-through-iap \
            --quiet \
            --command="sudo google_metadata_script_runner startup"

      # Guards against the silent-staleness failure this step previously had: the
      # old version targeted a nonexistent instance, wrote container-declaration
      # metadata this VM does not read, and ended in `|| true` — so it reported
      # success while the host kept running an image from days earlier.
      - name: Verify Deployed Container Matches Pushed Image
        run: |
          IMAGE_URI="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/openclaw/app:latest"
          EXPECTED_DIGEST="$(gcloud container images describe "$IMAGE_URI" --format='value(image_summary.digest)')"
          RUNNING_DIGEST="$(gcloud compute ssh openclaw-vm \
            --zone=${{ vars.GCP_ZONE }} \
            --project=${{ vars.GCP_PROJECT_ID }} \
            --tunnel-through-iap \
            --quiet \
            --command="sudo docker inspect --format='{{index .RepoDigests 0}}' openclaw-container" \
            | tr -d '\r' | sed 's/.*@//')"
          echo "Expected digest: $EXPECTED_DIGEST"
          echo "Running digest:  $RUNNING_DIGEST"
          if [ "$EXPECTED_DIGEST" != "$RUNNING_DIGEST" ]; then
            echo "::error ::Deployed container does not match the image just pushed."
            exit 1
          fi
          echo "Deployed container matches the pushed image."
